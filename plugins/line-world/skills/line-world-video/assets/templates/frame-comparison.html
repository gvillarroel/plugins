<!doctype html>
<html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="data:,">
<title>Comparar notas de montaje</title>
<style>
:root{color-scheme:light;--ink:#333e48;--wine:#9e1b32;--paper:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 "Segoe UI",Arial,sans-serif}
main{max-width:80rem;margin:auto;padding:clamp(1rem,3vw,3rem)}h1,h2{line-height:1.2}h1{font:normal clamp(1.6rem,4vw,2.5rem)/1.15 Georgia,serif}
p{max-width:76ch}section{border-top:2px solid var(--ink);margin:2rem 0}h2{font-size:1.2rem;overflow-wrap:anywhere}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.5rem;align-items:start}
figure{margin:0;min-width:0}.picture{position:relative;width:fit-content;max-width:100%;margin:auto}
img{display:block;width:auto;height:auto;max-width:100%;max-height:65vh}
i{position:absolute;width:1.12rem;height:1.12rem;border:3px solid var(--wine);border-radius:50%;outline:2px solid var(--paper);transform:translate(-50%,-50%)}
figcaption{font-variant-numeric:tabular-nums;text-align:center;margin-top:.5rem}a{color:var(--wine);text-underline-offset:.15em}
@media(max-width:45rem){.pair{grid-template-columns:1fr}}
</style>
<main><h1>Comparar notas de montaje</h1>
<p>Revisa el detalle marcado en cada versión. Para recorrer el intervalo completo, importa las notas en el visor de la candidata.</p>
<p><a href="notas-candidata.json" download>Descargar notas para el visor</a></p>
<!--NOTES--></main></html>
