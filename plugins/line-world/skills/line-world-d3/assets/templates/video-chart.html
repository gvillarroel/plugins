<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Data chart</title><style>
html,body{margin:0;height:100%;background:#fff}svg{display:block;width:100%;height:100%;font-family:Arial,sans-serif;font-variant-numeric:tabular-nums}
</style></head><body>
<svg id="stage" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="asset-title asset-desc" data-colorset="colorset1"><title id="asset-title"></title><desc id="asset-desc"></desc>__CHART_FONT__</svg>
<script src="d3.min.js"></script><script>
(() => {
"use strict";
const data = __DATA__;
const stage = d3.select("#stage");
const palette = {paper:"#ffffff", ink:"#333e48", red:"#9e1b32", muted:"#696969", rule:"#cfcfcf"};
const locale = data.locale || "en";
const spanish = locale.toLowerCase().startsWith("es");
const missing = spanish ? "Sin dato" : "No data";
const num = new Intl.NumberFormat(locale, {maximumSignificantDigits:21});
const monthDay = new Intl.DateTimeFormat(locale, {timeZone:"UTC", day:"numeric",month:"short"});
const fullDate = new Intl.DateTimeFormat(locale, {timeZone:"UTC",day:"numeric",month:"short",year:"numeric"});
const fmt = value => value == null ? missing : (Math.abs(value)>0 && Math.abs(value)<1e-8 ?
  value.toExponential() : num.format(value)).replace(/^-/, "−");
const utc = s => new Date(s+"T00:00:00Z");
const lineMode = data.kind === "time-series";
document.documentElement.lang = locale;
document.title = data.title || data.unit;
stage.select("title").text(data.title || data.unit);
stage.select("desc").text(lineMode ? (spanish ? "Observaciones por fecha, con huecos donde faltan medidas." : "Observations on a calendar scale. Missing measures leave gaps.") :
  (spanish ? "Comparación de valores con un cero común." : "Values compared on a common zero baseline."));
function text(g,x,y,content,size,opts={}) {
  return g.append("text").attr("x",x).attr("y",y).attr("font-size",size).attr("fill",opts.color || palette.ink)
    .attr("text-anchor",opts.anchor || "start").attr("font-weight",opts.weight || 400)
    .attr("font-family",opts.family || "ChartSpace, Arial, sans-serif").text(content);
}
function rule(g,x1,y1,x2,y2,color,width=1) {
  return g.append("line").attr("x1",x1).attr("y1",y1).attr("x2",x2).attr("y2",y2).attr("stroke",color).attr("stroke-width",width);
}
function fitTitle(node, width, size, minimum) {
  let px=size;
  while (node.node().getComputedTextLength()>width && px>minimum) node.attr("font-size", --px);
}
function wrapLabel(node, width, alignBottom=false) {
  if(node.node().getComputedTextLength()<=width) return 1;
  const original=node.text(), x=node.attr("x"), y=+node.attr("y");
  const height=+node.attr("font-size")*1.13, lines=[];
  let pending=Array.from(original);
  while(pending.length){
    let n=pending.length;
    while(n>1 && node.text(pending.slice(0,n).join("")).node().getComputedTextLength()>width) n--;
    const space=pending.lastIndexOf(" ",n);
    if(n<pending.length && space>0) n=space;
    lines.push(pending.splice(0,n).join("").trim());
    while(pending[0]===" ") pending.shift();
  }
  node.text("").attr("aria-label",original);
  lines.forEach((s,i)=>node.append("tspan").attr("x",x)
    .attr("y",y+(alignBottom?i-lines.length+1:i)*height).text(s));
  return lines.length;
}
let seconds=0, state, paint;
function draw() {
  const w=Math.round(stage.node().clientWidth), h=Math.round(stage.node().clientHeight);
  if(!w || !h) return;
  stage.attr("viewBox","0 0 "+w+" "+h).attr("width",w).attr("height",h);
  stage.selectAll("g.content").remove();
  const g=stage.append("g").attr("class","content");
  g.append("rect").attr("width",w).attr("height",h).attr("fill",palette.paper);
  const mobile=w<680;
  const scale=mobile?1:Math.max(.9,Math.min(w/1020,h/620,2.4));
  const pad=mobile?22:Math.round(w*.068), right=w-pad, available=right-pad;
  const tiny=mobile?14:17*scale, body=mobile?18:23*scale, heading=mobile?31:45*scale;
  let top=mobile?Math.min(80,h*.09):Math.max(heading*1.4,h*.13);
  if(data.title){
    const title=text(g,pad,top,data.title,heading,{family:"Georgia, serif"});
    fitTitle(title,available,heading,body);
    top+=(wrapLabel(title,available)-1)*+title.attr("font-size")*1.13;
    top+=mobile?32:40*scale;
  }
  text(g,pad,top,data.unit,tiny,{color:palette.muted}).attr("class","unit");
  top+=mobile?23:27*scale;
  if (lineMode) drawTimeline(g,{w,h,pad,right,top,mobile,scale,tiny,body});
  else drawComparison(g,{w,h,pad,right,top,mobile,scale,tiny,body});
  window.renderAt(seconds);
}

function drawComparison(g,{h,pad,right,top,mobile,scale,tiny,body}) {
  const rows=data.records, width=right-pad;
  const labels=g.append("g").attr("id","source-table");
  const marks=g.append("g").attr("id","comparison");
  const vals=rows.map(d=>d.value).filter(v=>v!=null);
  let min=Math.min(0,...vals), max=Math.max(0,...vals);
  if(min===max) max=1;
  const chartLeft=mobile?pad:pad+width*.47, chartRight=right;
  const x=d3.scaleLinear().domain([min,max]).nice(4).range([chartLeft,chartRight]);
  const bottomSpace=mobile?60:70*scale;
  const gap=Math.min((h-top-bottomSpace)/rows.length, mobile?94:105*scale);
  const first=top+(mobile?gap*.42:gap*.58), axis=top+rows.length*gap+(mobile?5:10);
  const rowY=i=>first+i*gap;
  const axisSize=mobile?tiny:tiny*.93;
  const ticks=x.ticks(mobile?3:4);
  if(!ticks.includes(0)) ticks.push(0);
  const axes=g.append("g");
  rule(axes,chartLeft,axis,chartRight,axis,palette.rule);
  ticks.forEach(t=>{
    const pos=x(t);
    rule(axes,pos,axis,pos,axis+5,palette.muted);
    const label=text(axes,pos,axis+axisSize+9,fmt(t),axisSize,{color:palette.muted,anchor:"middle"});
    if(pos-chartLeft<label.node().getComputedTextLength()/2) label.attr("text-anchor","start");
    if(chartRight-pos<label.node().getComputedTextLength()/2) label.attr("text-anchor","end");
  });
  const barY=i=>rowY(i)+(mobile?Math.min(22,gap*.34):-body*.28);
  if(mobile) rows.forEach((d,i)=>rule(axes,x(0),barY(i)-8,x(0),barY(i)+8,palette.muted,1.4).attr("class","zero"));
  else rule(axes,x(0),barY(0)-10*scale,x(0),axis,palette.muted,1.4*scale).attr("class","zero");
  if(!vals.length) axes.remove();
  const table=labels.selectAll("g").data(rows,d=>d.id).join("g").attr("class","record").attr("data-entity-id",d=>d.id);
  const bars=marks.selectAll("g").data(rows,d=>d.id).join("g").attr("class","mark").attr("data-entity-id",d=>d.id);
  const valueEdge=mobile?right:chartLeft-36*scale;
  table.each(function(d,i){
    const row=d3.select(this), y=rowY(i);
    const displayed=(data.signed && d.value>0?"+":"")+fmt(d.value);
    const value=text(row,valueEdge,y,displayed,body,{anchor:"end",weight:600}).attr("class","source-value")
      .attr("data-value",d.value==null?"null":d.value);
    const name=text(row,pad,y,d.label,body,{weight:500});
    const remaining=valueEdge-pad-value.node().getComputedTextLength()-16*scale;
    fitTitle(name,remaining,body,tiny);
    wrapLabel(name,remaining,true);
    if(i && mobile) rule(row,pad,y-gap*.60,right,y-gap*.60,palette.rule);
  });
  bars.each(function(d,i){
    if(d.value==null) return;
    const mark=d3.select(this), y=barY(i);
    rule(mark,x(0),y,x(d.value),y,palette.ink,mobile?7:9*scale).attr("class","value-mark").attr("data-value",d.value);
    if(d.value===0) mark.append("circle").attr("class","zero-dot").attr("cx",x(0)).attr("cy",y).attr("r",3.5*scale).attr("fill",palette.ink);
  });
  // At short durations, keep fewer focus changes; every source row remains visible.
  const focusCount=Math.max(1,Math.min(rows.length,Math.floor(data.duration/2.5)));
  const focus=data.focus?[rows.find(r=>r.id===data.focus)]:Array.from({length:focusCount},(_,i)=>
    rows[focusCount===1?0:Math.round(i*(rows.length-1)/(focusCount-1))]);
  const accent=rule(g,0,0,0,0,palette.red,mobile?7:9*scale).attr("data-motion-track","bar-emphasis");
  const marker=g.append("circle").attr("r",mobile?5:6*scale).attr("fill",palette.red)
    .attr("data-motion-track","end-marker");
  paint=t=>{
    const hold=data.duration/focus.length, index=Math.min(focus.length-1,Math.floor(t/hold));
    const active=focus[index], row=rows.indexOf(active);
    const elapsed=t-index*hold, reveal=Math.min(1.5,hold*.4), u=Math.min(1,elapsed/reveal);
    const progress=u*u*(3-2*u), moving=elapsed<reveal;
    table.each(function(d){d3.select(this).selectAll("text").attr("fill",d.id===active.id?palette.red:palette.ink)});
    // Highlight the already complete value. For zero or null the reading cue
    // underlines the value text, leaving the quantitative baseline untouched.
    const underline=active.value===0||active.value===null;
    const rightEdge=underline?valueEdge:x(active.value);
    const leftEdge=underline?valueEdge-table.nodes()[row].querySelector(".source-value").getComputedTextLength():x(0);
    const y=underline?rowY(row)+5:barY(row), tip=leftEdge+(rightEdge-leftEdge)*progress;
    accent.attr("x1",leftEdge).attr("x2",tip).attr("y1",y).attr("y2",y)
      .attr("stroke-width",underline?2*scale:mobile?7:9*scale);
    marker.attr("cx",tip).attr("cy",y);
    return {selectedId:active.id,value:active.value,holdSeconds:hold-reveal,guideRadius:mobile?5:6*scale,
      focusPoint:[rightEdge,y], phase:moving?"emphasis":"reading",tracks:[
        {id:"bar-emphasis",target:active.id,active:moving,progress},
        {id:"end-marker",target:active.id,active:moving,progress}]};
  };
}
function drawTimeline(g,{h,pad,right,top,mobile,scale,tiny,body}) {
  const obs=data.observations.map(d=>({...d,utc:utc(d.date)})), values=obs.filter(d=>d.value!=null);
  const first=obs[0],last=obs[obs.length-1], lastValue=values[values.length-1];
  const min=d3.min(values,d=>d.value), max=d3.max(values,d=>d.value);
  const delta=min===max?Math.max(1,Math.abs(min)*.1):0;
  const y=d3.scaleLinear().domain([min-delta,max+delta]).nice(mobile?4:5);
  const yTicks=y.ticks(mobile?4:5);
  const measure=text(g,0,0,"",tiny);
  const labelWidth=d3.max(yTicks,n=>{measure.text(fmt(n));return measure.node().getComputedTextLength()});measure.remove();
  const left=pad+labelWidth+12*scale;
  const x=d3.scaleUtc().domain([first.utc,last.utc]).range([left,right]);
  const valueSize=mobile?48:60*scale;
  const value=text(g,pad,top+valueSize,fmt(last.value),valueSize,{weight:650}).attr("class","last-value");
  fitTitle(value,right-pad,valueSize,body);
  const date=text(g,pad,top+valueSize+body*1.45,fullDate.format(last.utc),body,{color:palette.muted}).attr("class","last-date");
  const valueBox=value.node().getBBox(), dateBox=date.node().getBBox(), gap=Math.max(6,body*.35);
  // Font ascent and descent differ across renderers. Position the two actual glyph boxes.
  const shift=Math.max(0,valueBox.y+valueBox.height+gap-dateBox.y);
  date.attr("y",+date.attr("y")+shift);
  const chartTop=top+valueSize+body*2.9+shift;
  const chartBottom=Math.min(h-(mobile?97:100*scale),chartTop+(mobile?355:330*scale));
  y.range([chartBottom,chartTop]);
  yTicks.forEach(n=>{
    rule(g,left,y(n),right,y(n),n===0?palette.muted:palette.rule,n===0?1.6:1);
    text(g,left-9*scale,y(n)+tiny*.32,fmt(n),tiny,{color:palette.muted,anchor:"end"});
  });
  const acrossYears=first.utc.getUTCFullYear()!==last.utc.getUTCFullYear();
  const formatter=acrossYears?fullDate:monthDay;
  const dateCandidates=[first, ...(obs.length>3 && !acrossYears ? [obs[Math.floor(obs.length/2)]]:[]), last];
  let prevEnd=-Infinity;
  dateCandidates.forEach((point,i)=>{
    const anchor=i===0?"start":i===dateCandidates.length-1?"end":"middle";
    const el=text(g,x(point.utc),chartBottom+28*scale,formatter.format(point.utc),tiny,{color:palette.muted,anchor});
    const box=el.node().getBBox(), reserved=mobile?74:105*scale;
    if(i>0 && i<dateCandidates.length-1 && (box.x<=prevEnd+6 || box.x+box.width>right-reserved)) el.remove();
    else prevEnd=box.x+box.width;
  });
  const defined=d=>d.value!=null;
  const plot=g.append("g").attr("id","timeline").attr("data-entity-id",data.id||"series");
  const clip=plot.append("defs").append("clipPath").attr("id","time-reveal").attr("clipPathUnits","userSpaceOnUse")
    .append("rect").attr("x",left-6*scale).attr("y",chartTop-10*scale).attr("height",chartBottom-chartTop+20*scale)
    .attr("data-motion-track","series-trace");
  const marks=plot.append("g").attr("clip-path","url(#time-reveal)");
  const path=d3.line().defined(defined).x(d=>x(d.utc)).y(d=>y(d.value));
  marks.append("path").datum(obs).attr("class","trend").attr("d",path).attr("fill","none").attr("stroke",palette.red)
    .attr("stroke-width",mobile?3.5:4.5*scale).attr("stroke-linejoin","round").attr("stroke-linecap","round");
  plot.selectAll("circle").data(values).join("circle").attr("class","observation").attr("data-date",d=>d.date)
    .attr("data-value",d=>d.value).attr("cx",d=>x(d.utc)).attr("cy",d=>y(d.value)).attr("r",mobile?3.7:4.5*scale).attr("fill",palette.red)
    .append("title").text(d=>fullDate.format(d.utc)+" · "+fmt(d.value)+" "+data.unit);
  const absent=obs.filter(d=>d.value==null);
  if(absent.length) {
    absent.forEach(d=>{
      const pos=x(d.utc), cy=chartBottom+43*scale, s=3.5*scale;
      plot.append("path").attr("class","missing").attr("data-date",d.date).attr("data-x",pos)
        .attr("d",`M${pos-s},${cy-s}l${2*s},${2*s}m0,${-2*s}l${-2*s},${2*s}`)
        .attr("stroke",palette.ink).attr("stroke-width",1.5*scale).attr("fill","none").append("title").text(fullDate.format(d.utc)+" · "+missing);
    });
    text(g,pad,chartBottom+70*scale,"×  "+missing,tiny,{color:palette.muted});
  }
  const progressive=data.revealObservations===true;
  const reveal=progressive ? data.duration*.65 : Math.min(2.2,data.duration/3);
  const datedMarks=plot.selectAll(".observation,.missing");
  let presented=-1;
  const dateRail=rule(plot,left,chartBottom+2*scale,left,chartBottom+2*scale,palette.muted,2*scale)
    .attr("data-motion-track","date-progress");
  const cursor=plot.append("path").attr("data-motion-track","date-cursor").attr("fill",palette.red)
    .attr("d",`M${-5*scale},0H${5*scale}L0,${-7*scale}Z`);
  paint=t=>{
    const u=Math.min(1,t/reveal), eased=u*u*(3-2*u), pos=left+(right-left)*eased;
    const current=x.invert(pos), i=Math.max(0,d3.bisector(d=>d.utc).right(obs,current)-1);
    if(progressive && i!==presented){
      const record=obs[i];
      datedMarks.attr("visibility",function(){return this.dataset.date<=record.date ? null : "hidden";});
      value.attr("font-size",valueSize).text(fmt(record.value));
      fitTitle(value,right-pad,valueSize,body);
      date.text(fullDate.format(record.utc));
      presented=i;
    }
    const drawing=obs[i].value!==null && obs[i+1]?.value!=null;
    const previous=values[d3.bisector(d=>d.utc).right(values,current)-1];
    const traceX=drawing||u===1?pos:previous?x(previous.utc):left;
    clip.attr("width",6*scale+(traceX-left)+(u===1?6*scale:0));
    dateRail.attr("x2",pos);
    cursor.attr("transform",`translate(${pos} ${chartBottom+9*scale})`);
    return {selectedId:data.id||"series",value:progressive?obs[i].value:last.value,holdSeconds:data.duration-reveal,
      guideRadius:0,reveal:eased,lastObservedDate:progressive ? (previous?.date??null) : lastValue.date,focusPoint:[pos,chartBottom],
      phase:t<reveal?"emphasis":"reading", tracks:[
        {id:"series-trace",target:data.id||"series",active:t<reveal&&drawing,progress:(traceX-left)/(right-left)},
        {id:"date-progress",target:data.id||"series",active:t<reveal,progress:eased},
        {id:"date-cursor",target:data.id||"series",active:t<reveal,progress:eased}]};
  };
}
window.VIDEO_DATA=data;
window.renderAt=clock=>{
  seconds=Math.min(data.duration,Math.max(0,Number(clock)||0));
  if(paint) state={seconds,duration:data.duration,unit:data.unit,palette:"colorset1",guideColor:palette.red,
    d3Version:d3.version,...paint(seconds)};
  return state;
};
window.snapshot=()=>structuredClone(state);
draw();
document.fonts.ready.then(draw);
new ResizeObserver(draw).observe(stage.node());
})();
</script></body></html>
