[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "knowledge-catalog-curator"
version = "0.3.0"
description = "Semantic metadata and synthetic lineage curation for Knowledge Catalog, Python and MCP Apps"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["mcp>=1.26,<2", "google-auth>=2.38,<3", "requests>=2.32,<3", "rdflib>=7.1,<8", "pyshacl>=0.30,<1", "scikit-learn>=1.6,<2", "pypdf>=6,<7", "python-docx>=1.2,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.14,<1"]

[project.scripts]
kc = "knowledge_catalog.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_catalog"]

[tool.hatch.build.targets.wheel.force-include]
"ontology" = "knowledge_catalog/data"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["knowledge_catalog"]
patch = ["subprocess"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
