<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Editable kinetic video starter</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#141419;color:#faf9f6;font-family:Arial,Helvetica,sans-serif}
main{position:relative;width:100vw;height:100vh;padding:10vmin;display:flex;flex-direction:column;justify-content:center}
.eyebrow{font-size:3.5vmin;letter-spacing:.17em;text-transform:uppercase;color:#9da5b0}
h1{font-size:13vmin;line-height:.98;letter-spacing:-.055em;margin:5vmin 0;max-width:90vw;overflow-wrap:anywhere}
p{font-size:4.5vmin;line-height:1.3;max-width:70vw;margin:0;color:#c9ccd2}
.line{height:1.6vmin;background:#ffb05b;width:30vmin;margin-top:7vmin;transform-origin:left}
footer{position:absolute;bottom:8vmin;left:10vmin;font-size:2.8vmin;color:#9da5b0}
</style>
<main>
  <div class="eyebrow" id="label"></div>
  <h1 id="headline"></h1>
  <p id="caption"></p>
  <div class="line" id="line"></div>
  <footer id="progress"></footer>
</main>
<script>
// Replace these example beats and motion with the observed style recipe.
const beats=[
 {label:"A new idea",headline:"Find the rhythm.",caption:"Start with one clear visual beat."},
 {label:"Make it yours",headline:"Tell a new story.",caption:"Keep the structure. Write original words."},
 {label:"Ready to share",headline:"Give it room.",caption:"Let the final thought settle."}
];
const duration=6;
const byId=id=>document.getElementById(id);
window.renderAt=function(seconds){
 const t=Math.min(duration-1e-6,Math.max(0,seconds));
 const index=Math.min(beats.length-1,Math.floor(t/(duration/beats.length)));
 const local=t-index*(duration/beats.length);
 const ease=1-Math.pow(1-Math.min(1,local/.45),3);
 const beat=beats[index];
 byId("label").textContent=beat.label;
 byId("headline").textContent=beat.headline;
 byId("caption").textContent=beat.caption;
 for(const id of ["label","headline","caption"]){
   byId(id).style.opacity=String(ease);
   byId(id).style.transform=`translateY(${(1-ease)*5}vmin)`;
 }
 byId("line").style.transform=`scaleX(${.2+.8*ease})`;
 byId("progress").textContent=`${String(index+1).padStart(2,"0")} / ${String(beats.length).padStart(2,"0")}`;
 return {seconds:t,beat:index+1};
};
window.renderAt(.8);
</script>
</html>
