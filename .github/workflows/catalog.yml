name: Verify marketplace
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install PyYAML==6.0.3 Pillow==12.2.0
      - run: python -X utf8 tools/catalog.py
      - run: python -X utf8 tools/test_payloads.py
